esphome:
  on_boot:
    then:
      - bk72xx_ble_tracker.start_scan
      - bk72xx_ble_tracker.stop_scan

bk72xx_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 200ms
    window: 20ms
    duration: 5min
    continuous: false
  on_ble_advertise:
    - mac_address:
        - AA:BB:CC:DD:EE:FF
        - FF:EE:DD:CC:BB:AA
      then:
        - lambda: |-
            ESP_LOGD("main", "The device address (%s) exists in list", x.address_str().c_str());
    - mac_address: AC:37:43:77:5F:4C
      then:
        - lambda: |-
            ESP_LOGD("main", "The device address is %s", x.address_str().c_str());
    - then:
        - lambda: |-
            ESP_LOGD("main", "The device address is %s", x.address_str().c_str());
  on_ble_service_data_advertise:
    - service_uuid: ABCD
      then:
        - lambda: |-
            ESP_LOGD("main", "Length of service data is %zu", x.size());
  on_ble_manufacturer_data_advertise:
    - manufacturer_id: ABCD
      then:
        - lambda: |-
            ESP_LOGD("main", "Length of manufacturer data is %zu", x.size());
  on_scan_end:
    - then:
        - lambda: |-
            ESP_LOGD("main", "Scan ended");
