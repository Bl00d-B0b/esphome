esphome:
  name: test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esp32_ble_tracker:

sensor:
  - platform: bthome_mithermometer
    mac_address: A4:C1:38:4E:16:78
    bindkey: eef418daf699a0c188f3bfd17e4565d9
    temperature:
      name: Temperature
    humidity:
      name: Humidity
      accuracy_decimals: 1
    battery_level:
      name: Battery
    battery_voltage:
      name: Battery Voltage
    signal_strength:
      name: Signal
